name: react ci pipeline
on: 
  push:
    branches:
        - main
  workflow_dispatch:
jobs:
   build:
    runs-on: ubuntu-latest
    steps:
         - name: Checkout Repository
           uses: actions/checkout@v4

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 25

         - name: Install Dependencies
           run: npm install

         - name: Run Unit Tests
           run: npm test 

         - name: Build React App
           run: npm run build