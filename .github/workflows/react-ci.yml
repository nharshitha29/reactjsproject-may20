name: react ci pipeline
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
jobs:
   build:
    runs-on: ubuntu-latest
    steps:
         - name: Checkout Repository
           uses: actions/checkout@v5

         - name: Setup Node.js
           uses: actions/setup-node@v5
           with:
              node-version: 22

         - name: Install Dependencies
           run: npm install

         - name: Run Tests
           run: |
              npx vitest --run \
              --reporter=default \
              --reporter=junit \
              --outputFile=test-results.xml

         - name: Publish Test Results
           uses: EnricoMi/publish-unit-test-result-action@v2
           if: always()
           with:
              files: |
                 test-results.xml

         - name: Build React App
           run: npm run build
         

         - name: Upload Build Artifact
           uses: actions/upload-artifact@v4
           with:
             name: react-build
             path: dist/   
         
         - name: Login to Docker Hub
           uses: docker/login-action@v3
           with:
             username: ${{ secrets.DOCKER_USERNAME }}
             password: ${{ secrets.DOCKER_PASSWORD }}

         - name: Build Docker Image
           run: |
              docker build -t ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }} .
              docker tag ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }} \
                     ${{ secrets.DOCKER_USERNAME }}/react-app:latest

         - name: Push Docker Image
           run: |
              docker push ${{ secrets.DOCKER_USERNAME }}/react-app:latest
         
         - name: Azure Login
           uses: azure/login@v2
           with:
              creds: ${{ secrets.AZURE_CREDENTIALS }}

         - name: Setup Terraform
           uses: hashicorp/setup-terraform@v3

         - name: Terraform Init
           run: terraform init
           working-directory: ./terraform

         - name: Terraform Format Check
           run: terraform fmt 
           working-directory: ./terraform

         - name: Terraform Validate
           run: terraform validate
           working-directory: ./terraform

         - name: Terraform Plan
           run: terraform plan
           working-directory: ./terraform

         - name: Terraform Apply
           run: terraform apply -auto-approve
           working-directory: ./terraform
         
         - name: Setup Kubectl
           uses: azure/setup-kubectl@v4
           with:
              version: latest

         - name: Get AKS Credentials
           run: |
              az aks get-credentials \
              --resource-group myRG \
              --name myAKSCluster \
              --overwrite-existing

         - name: Verify Cluster
           run: kubectl get nodes
         
         - name: Deploy Application
           run: |
              kubectl apply -f deployment.yaml
              kubectl apply -f service.yaml

         - name: Verify Deployment
           run: |
              kubectl get pods
              kubectl get svc